<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRAK507</title>

    <script type="text/javascript">
        function fungsiHello(txt) {
            alert(txt);
        }
    </script>
</head>
<body>
    <form>
        <input type="button"
        onclick="fungsiHello ('Hello')"
        value="panggil fungsi hello">
    </form>
    <p>Tekan tombol di atas, dan sebuah fungsi akan dipanggil</p>
</body>
</html>
