<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRAK509</title>
</head>
<body>
    
    <p>Klik tombol berikut untuk menampilkan konfirmasi</p>

    <button onclick="myFunction()">Klik Di sini</button>

    <p id="demo"></p>

    <script>
        function myFunction() {
            var x;

            var name = prompt ("Silahkan masukkan nama anda", "Nama Anda");

            if (name!=null)
                {
                    var x = " Selamat Datang! " + name + " Bagaimana kabar anda hari ini?";
                    document.getElementById("demo").innerHTML = x;
                }
        }
    </script>
    
</body>
</html>
